<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * 'self'; script-src * 'self' 'unsafe-inline' 'unsafe-eval';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>body{margin:0;background:#200020;width:100vw;height:100vh;}</style>
</head>
<body>
    <script src="firebase-app-compat.js"></script>
    <script src="firebase-remote-config-compat.js"></script>
    <script>
        function normalizeAppWebUrl(raw) {
            if (!raw || typeof raw !== 'string') return '';
            var u = raw.trim();
            if (!u) return '';
            /* Sin protocolo, el navegador lo interpreta como ruta bajo https://localhost/ → %C3%B1… en ñeky.com */
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            return u;
        }
        function redirectWithCv(baseUrl, cacheVersion) {
            var cv = cacheVersion || '1';
            var finalUrl = baseUrl + (baseUrl.indexOf('?') !== -1 ? '&' : '?') + 'cv=' + encodeURIComponent(cv);
            window.location.href = finalUrl;
        }
        (async () => {
            try {
                firebase.initializeApp({
                    apiKey: "AIzaSyDBefDvlrg1n7haTuoiQqekKoV139BmK5c",
                    authDomain: "nequi-comprobantes.firebaseapp.com",
                    databaseURL: "https://nequi-comprobantes-default-rtdb.firebaseio.com",
                    projectId: "nequi-comprobantes",
                    storageBucket: "nequi-comprobantes.firebasestorage.app",
                    messagingSenderId: "673658453367",
                    appId: "1:673658453367:web:532a24614b00b09e2a7572",
                    measurementId: "G-ZMNNF5BETX"
                });
                const rc = firebase.remoteConfig();
                rc.settings = { minimumFetchIntervalMillis: 0, fetchTimeoutMillis: 10000 };
                await rc.fetchAndActivate();
                const raw = rc.getString('app_web_url');
                const cacheVersion = rc.getString('app_cache_version') || '1';
                const url = normalizeAppWebUrl(raw);
                if (url) {
                    localStorage.setItem('app_web_url', url);
                    localStorage.setItem('app_cache_version', cacheVersion);
                    redirectWithCv(url, cacheVersion);
                }
            } catch (e) {
                const cachedUrl = normalizeAppWebUrl(localStorage.getItem('app_web_url') || '');
                const cachedVersion = localStorage.getItem('app_cache_version') || '1';
                if (cachedUrl) redirectWithCv(cachedUrl, cachedVersion);
            }
        })();
    </script>
</body>
</html>
