<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Opciones para enviar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #f8f8f8; font-family: "Manrope", sans-serif; }
.pantalla { width: 100vw; height: 100dvh; overflow: hidden; display: flex; align-items: stretch; justify-content: stretch; }
.pantalla svg { width: 100%; height: 100%; display: block; preserveAspectRatio: none; }
.opcion { cursor: pointer; touch-action: manipulation; }
.opcion:active { opacity: 0.6; }
svg text, svg path, svg rect, svg circle { user-select: none; -webkit-user-select: none; }
.text { font-family: "Manrope", Arial, sans-serif; fill: #291529; }
.subtext { font-family: "Manrope", Arial, sans-serif; fill: #626262; }
</style>
</head>

<body>
<div class="pantalla">

    <text x="610" y="1387" class="text" font-size="18" font-weight="500">ALESS</text>

</svg>
</div>

<script>
function ir(destino) {
    const rutas = {
        nequi: "Ge.html",
        bancolombia: "Ban2.html",
        breb: "archivo2.html",
        otros: "Otro.html"
    };
    if (rutas[destino]) {
        window.location.href = rutas[destino];
    }
}

function contacto(nombre) {
    alert("Seleccionaste a " + nombre);
}

function volver() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "index.html";
    }
}
</script>
</body>
</html>
